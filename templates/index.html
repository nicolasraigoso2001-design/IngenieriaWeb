<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Turismo Raigoso</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
    background-size: cover;
    background-position: center;
    color:white;
}

/* LOGIN */

#login{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background: rgba(0,0,0,0.8);
    padding:40px;
    border-radius:10px;
    text-align:center;
    width:300px;
}

.login-box input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

.login-box button{
    width:100%;
    padding:10px;
    background:#00b4d8;
    border:none;
    border-radius:5px;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.login-box button:hover{
    background:#0077b6;
}

/* APP */

#app{
    display:none;
}

header{
    text-align:center;
    padding:40px;
    background: rgba(0,0,0,0.5);
}

nav{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:20px;
    background: rgba(0,0,0,0.6);
}

nav button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#00b4d8;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

nav button:hover{
    background:#0077b6;
    transform:scale(1.05);
}

section{
    text-align:center;
    padding:40px;
}

#contenedor{
    margin-top:20px;
    background: rgba(0,0,0,0.6);
    padding:30px;
    border-radius:10px;
    width:70%;
    margin-left:auto;
    margin-right:auto;
}

footer{
    text-align:center;
    padding:20px;
    background: rgba(0,0,0,0.7);
    position:fixed;
    bottom:0;
    width:100%;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login">

<div class="login-box">

<h2>🌎 Turismo Raigoso</h2>
<p>Iniciar sesión</p>

<input type="text" id="usuario" placeholder="Usuario">
<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">Ingresar</button>

</div>

</div>

<!-- APLICACIÓN -->

<div id="app">

<header>

<h1>🌎 Turismo Raigoso</h1>
<p>Explora los mejores destinos turísticos</p>

</header>

<nav>

<button onclick="cargarTours()">🌍 Tours</button>
<button onclick="cargarClientes()">👥 Clientes</button>
<button onclick="cargarReservas()">📅 Reservas</button>

</nav>

<section>

<h2 id="titulo">Bienvenido</h2>

<div id="contenedor">
<p>Selecciona una opción para comenzar a explorar nuestros sitioss.</p>
</div>

</section>

<footer>

<p>Gracias por visitarnos ☁️</p>

</footer>

</div>

<script src="/static/app.js"></script>

<script>

function login(){

let user = document.getElementById("usuario").value;
let pass = document.getElementById("password").value;

if(user === "admin" && pass === "123"){

document.getElementById("login").style.display = "none";
document.getElementById("app").style.display = "block";

}else{

alert("Usuario o contraseña incorrectos");

}

}

</script>

</body>

</html>
